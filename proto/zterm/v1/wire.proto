syntax = "proto3";

package zterm.v1;

enum MessageKind {
  MESSAGE_KIND_UNSPECIFIED = 0;
  LOCAL_READINESS_REQUEST = 1;
  LOCAL_READINESS_RESPONSE = 2;
  LOCAL_STATUS_REQUEST = 3;
  LOCAL_STATUS_RESPONSE = 4;
  LOCAL_VALIDATE_SETUP_REQUEST = 5;
  LOCAL_VALIDATE_SETUP_RESPONSE = 6;
  LOCAL_STOP_REQUEST = 7;
  LOCAL_STOP_RESPONSE = 8;
  LOCAL_UPDATE_PREFLIGHT_REQUEST = 9;
  LOCAL_UPDATE_PREFLIGHT_RESPONSE = 10;
  SERVICE_ERROR_RESPONSE = 11;
  PAIR_OFFER = 100;
  PAIR_HANDSHAKE = 101;
  SESSION_LIST_REQUEST = 200;
  SESSION_LIST_RESPONSE = 201;
  SESSION_CREATE_REQUEST = 202;
  SESSION_MUTATE_RESPONSE = 203;
  SESSION_RENAME_REQUEST = 204;
  SESSION_CLOSE_REQUEST = 205;
  SESSION_TAKEOVER_REQUEST = 206;
  TERMINAL_ATTACH_REQUEST = 300;
  TERMINAL_SNAPSHOT = 301;
  TERMINAL_DELTA = 302;
  TERMINAL_INPUT = 303;
  TERMINAL_RESIZE = 304;
  TERMINAL_DETACH = 305;
  TERMINAL_SNAPSHOT_APPLIED = 306;
  TERMINAL_SYNC_REQUEST = 307;
  TERMINAL_SYNC_REQUIRED = 308;
}

message WireFrame {
  uint32 wire_major = 1;
  uint32 kind = 2;
  bytes payload = 3;
  uint64 request_id = 4;
  uint32 deadline_ms = 5;
}
