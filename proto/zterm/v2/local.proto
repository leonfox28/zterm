syntax = "proto3";

package zterm.v2;

import "zterm/v2/common.proto";
import "zterm/v2/terminal.proto";

message LocalReadinessRequest {}

message LocalReadinessResponse {
  ProtocolVersion protocol = 1;
  string version = 2;
  uint64 started_at_unix = 3;
}

message LocalStatusRequest {}

message LocalStatusResponse {
  ProtocolVersion protocol = 1;
  string version = 2;
  string phase = 3;
  DeviceId device_id = 4;
  string endpoint_id = 5;
  string device_name = 6;
  string infrastructure_profile = 7;
  uint64 started_at_unix = 8;
  uint32 active_session_count = 9;
  repeated string active_session_names = 10;
  string network_state = 11;
  bool endpoint_bound = 12;
  uint64 network_bind_attempts = 13;
  string home_relay = 14;
  string address_publish_state = 15;
  string address_lookup_state = 16;
  uint32 authenticated_connection_count = 17;
  uint32 primary_connection_count = 18;
  uint32 active_stream_count = 19;
  uint32 direct_path_count = 20;
  uint32 relay_path_count = 21;
  string network_diagnostic = 22;
}

message LocalValidateSetupRequest {
  string device_name = 1;
  string infrastructure_profile = 2;
  string relay_url = 3;
}

message LocalValidateSetupResponse {
  DeviceId device_id = 1;
  string endpoint_id = 2;
}

message LocalStopRequest {
  bool force = 1;
  OperationId operation_id = 2;
}

message LocalStopResponse {
  uint32 active_session_count = 1;
  repeated string active_session_names = 2;
  bool stopping = 3;
}

message LocalUpdatePreflightRequest {}

message LocalUpdatePreflightResponse {
  uint32 active_session_count = 1;
  repeated string active_session_names = 2;
  bool interruption_required = 3;
}

// Same-UID-only resolution boundary. The daemon returns a frozen canonical
// target; callers never place an alias in a Session request.
message LocalTargetResolveRequest { string selector = 1; }
message LocalTargetResolveResponse { TargetSelector target = 1; }

// Same-UID-only envelope for one already encoded Session unary frame. The
// complete envelope remains subject to the ordinary 1 MiB control-payload
// ceiling; it is not a generic 8 MiB byte tunnel. The daemon validates one
// allowed Session control frame, forwards `frame` byte-for-byte, and returns
// the remote Session reply directly, preserving the inner request ID, kind,
// payload and unknown fields.
message LocalSessionUnaryRequest {
  DeviceId target_device_id = 1;
  bytes frame = 2;
}

// Same-UID-only request for one opaque authenticated Session service stream.
// The Unix socket itself identifies the tunnel; there is no multiplexing or
// caller-selected ALPN/purpose inside this envelope.
message LocalSessionTunnelOpenRequest {
  uint32 protocol_version = 1;
  DeviceId target_device_id = 2;
}

// Emitted only after exact-target validation, connection demand, remote
// authorization, and service-stream admission have all succeeded.
message LocalSessionTunnelOpened {
  uint32 protocol_version = 1;
}

// Opaque target Session bytes. Chunk boundaries have no Session meaning.
message LocalSessionTunnelData { bytes bytes = 1; }

// Address-free path sideband for this exact service-stream epoch.
message LocalSessionTunnelPath {
  TerminalConnectionPath path = 1;
  optional uint32 rtt_ms = 2;
}

// The sender will write no further Data frames in this direction.
message LocalSessionTunnelHalfClose {}

enum LocalSessionTunnelCloseReason {
  LOCAL_SESSION_TUNNEL_CLOSE_REASON_UNSPECIFIED = 0;
  LOCAL_SESSION_TUNNEL_CLOSE_REASON_REMOTE_EOF = 1;
  LOCAL_SESSION_TUNNEL_CLOSE_REASON_TRANSPORT_LOST = 2;
  LOCAL_SESSION_TUNNEL_CLOSE_REASON_DAEMON_STOPPING = 3;
  LOCAL_SESSION_TUNNEL_CLOSE_REASON_PROTOCOL_ERROR = 4;
}

// One content-free terminal outcome for this tunnel epoch. Target-generated
// Session errors remain opaque Data and are never translated into this type.
message LocalSessionTunnelClosed {
  LocalSessionTunnelCloseReason reason = 1;
}
