syntax = "proto3";

package zterm.v2;

import "zterm/v2/common.proto";

message TerminalAttachRequest {
  TargetSelector target = 1;
  SessionId session_id = 2;
  bool takeover = 3;
  string session_name = 4;
  bool create_main = 5;
  TerminalViewport viewport = 6;
  ResumeViewId resume_view_id = 7;
  optional uint64 known_revision = 8;
  reserved 9;
}

enum TerminalActiveScreen {
  TERMINAL_ACTIVE_SCREEN_UNSPECIFIED = 0;
  TERMINAL_ACTIVE_SCREEN_MAIN = 1;
  TERMINAL_ACTIVE_SCREEN_ALTERNATE = 2;
}

message TerminalModes {
  bool application_keypad = 1;
  bool application_cursor = 2;
  bool bracketed_paste = 3;
  bool focus_reporting = 4;
  uint32 mouse_mode = 5;
  uint32 mouse_encoding = 6;
  bool alternate_scroll = 7;
  uint32 keyboard_flags = 8;
}

// Decoded child-to-controller clipboard write. Raw OSC never crosses a zterm
// protocol boundary.
message TerminalClipboardWrite {
  AttachmentId attachment_id = 1;
  string text = 2;
}

message TerminalInput {
  OperationId operation_id = 1;
  AttachmentId attachment_id = 2;
  bytes bytes = 3;
}

message TerminalResize {
  OperationId operation_id = 1;
  AttachmentId attachment_id = 2;
  uint32 rows = 3;
  uint32 columns = 4;
}

message TerminalDetach { AttachmentId attachment_id = 1; }

message TerminalSnapshotApplied {
  AttachmentId attachment_id = 1;
  uint64 revision = 2;
}

message TerminalSyncRequest {
  AttachmentId attachment_id = 1;
  uint64 known_revision = 2;
}

message TerminalSyncRequired {
  AttachmentId attachment_id = 1;
  uint64 latest_revision = 2;
}

message TerminalLeaseLost {
  AttachmentId attachment_id = 1;
  uint64 generation = 2;
}

enum TerminalSessionEndReason {
  TERMINAL_SESSION_END_REASON_UNSPECIFIED = 0;
  TERMINAL_SESSION_END_REASON_NATURAL_EXIT = 1;
  TERMINAL_SESSION_END_REASON_EXPLICIT_CLOSE = 2;
  TERMINAL_SESSION_END_REASON_DAEMON_STOP = 3;
  TERMINAL_SESSION_END_REASON_DRIVER_FAILURE = 4;
}

message TerminalSessionEnded {
  SessionId session_id = 1;
  AttachmentId attachment_id = 2;
  TerminalSessionEndReason reason = 3;
  uint32 exit_code = 4;
  string signal = 5;
}

enum TerminalTransportState {
  TERMINAL_TRANSPORT_STATE_UNSPECIFIED = 0;
  TERMINAL_TRANSPORT_STATE_PREPARING = 1;
  TERMINAL_TRANSPORT_STATE_SYNCHRONIZING = 2;
  TERMINAL_TRANSPORT_STATE_ACTIVE = 3;
  TERMINAL_TRANSPORT_STATE_RECONNECTING = 4;
}

// Same-UID local IPC only. It is never accepted from or emitted to a remote
// normal-ALPN service stream.
message TerminalTransportStateEvent {
  AttachmentId attachment_id = 1;
  TerminalTransportState state = 2;
}

message TerminalScrollMetrics {
  uint64 epoch = 1;
  uint64 revision = 2;
  uint64 offset_from_bottom = 3;
  uint64 max_offset_from_bottom = 4;
  uint32 viewport_rows = 5;
}

enum TerminalViewportDisposition {
  TERMINAL_VIEWPORT_DISPOSITION_UNSPECIFIED = 0;
  TERMINAL_VIEWPORT_DISPOSITION_EXACT = 1;
  TERMINAL_VIEWPORT_DISPOSITION_REBASED = 2;
}

message TerminalHistoryWindowAnchor {
  uint64 epoch = 1;
  uint64 revision = 2;
  uint64 max_offset_from_bottom = 3;
  uint32 viewport_rows = 4;
  uint32 viewport_columns = 5;
}

message TerminalHistoryWindowRequest {
  AttachmentId attachment_id = 1;
  TerminalHistoryWindowAnchor anchor = 2;
  uint64 target_offset_from_bottom = 3;
  uint32 older_margin_rows = 4;
  uint32 newer_margin_rows = 5;
}

enum TerminalHistoryWindowOutcome {
  TERMINAL_HISTORY_WINDOW_OUTCOME_UNSPECIFIED = 0;
  TERMINAL_HISTORY_WINDOW_OUTCOME_FRAME = 1;
  TERMINAL_HISTORY_WINDOW_OUTCOME_CHANGED = 2;
  TERMINAL_HISTORY_WINDOW_OUTCOME_GAP = 3;
}

message TerminalRgbColor {
  uint32 red = 1;
  uint32 green = 2;
  uint32 blue = 3;
}

message TerminalColor {
  oneof value {
    bool default_color = 1;
    uint32 indexed = 2;
    TerminalRgbColor rgb = 3;
  }
}

message TerminalStyle {
  TerminalColor foreground = 1;
  TerminalColor background = 2;
  bool bold = 3;
  bool dim = 4;
  bool italic = 5;
  bool underline = 6;
  bool inverse = 7;
}

message TerminalCell {
  string contents = 1;
  bool wide = 2;
  bool wide_continuation = 3;
  TerminalStyle style = 4;
}

message TerminalSurfaceRow {
  repeated TerminalCell cells = 1;
  bool wrapped = 2;
}

message TerminalCursor {
  uint32 row = 1;
  uint32 column = 2;
  bool visible = 3;
  TerminalStyle style = 4;
}

message TerminalSurface {
  uint32 row_count = 1;
  uint32 column_count = 2;
  TerminalActiveScreen active_screen = 3;
  repeated TerminalSurfaceRow rows = 4;
  TerminalCursor cursor = 5;
  TerminalModes modes = 6;
  TerminalScrollMetrics scroll_metrics = 7;
}

message TerminalSemanticSnapshot {
  SessionId session_id = 1;
  AttachmentId attachment_id = 2;
  uint64 revision = 3;
  TerminalSurface surface = 4;
}

message TerminalSemanticRowPatch {
  uint32 row = 1;
  TerminalSurfaceRow replacement = 2;
}

message TerminalSemanticDelta {
  AttachmentId attachment_id = 1;
  uint64 from_revision = 2;
  uint64 to_revision = 3;
  uint32 row_count = 4;
  uint32 column_count = 5;
  TerminalActiveScreen active_screen = 6;
  repeated TerminalSemanticRowPatch row_patches = 7;
  TerminalCursor cursor = 8;
  TerminalModes modes = 9;
  TerminalScrollMetrics scroll_metrics = 10;
}

message TerminalSemanticHistoryWindowFrame {
  AttachmentId attachment_id = 1;
  TerminalHistoryWindowOutcome outcome = 2;
  TerminalViewportDisposition disposition = 3;
  TerminalHistoryWindowAnchor anchor = 4;
  uint64 target_offset_from_bottom = 5;
  sint64 first_row_from_live_top = 6;
  repeated TerminalSurfaceRow rows = 7;
  uint64 current_epoch = 8;
  uint64 current_revision = 9;
}

enum TerminalConnectionPath {
  TERMINAL_CONNECTION_PATH_UNSPECIFIED = 0;
  TERMINAL_CONNECTION_PATH_UNKNOWN = 1;
  TERMINAL_CONNECTION_PATH_DIRECT = 2;
  TERMINAL_CONNECTION_PATH_RELAY = 3;
}

// Same-UID local IPC only. It contains no address, relay URL, or device ID.
message TerminalConnectionStatusEvent {
  AttachmentId attachment_id = 1;
  TerminalConnectionPath path = 2;
  optional uint32 rtt_ms = 3;
}
