syntax = "proto3";
package zterm.v2;
import "zterm/v2/common.proto";

message UploadBegin {
  SessionId session_id = 1;
  AttachmentId attachment_id = 2;
  uint64 size = 3;
  string extension = 4;
}
message UploadReady { bytes transfer_id = 1; uint64 size = 2; }
message UploadChunk { bytes transfer_id = 1; uint64 offset = 2; bytes data = 3; }
message UploadProgress { bytes transfer_id = 1; uint64 accepted_bytes = 2; }
message UploadFinish { bytes transfer_id = 1; uint64 size = 2; }
message UploadCompleted { bytes transfer_id = 1; uint64 size = 2; string path = 3; }
message UploadCancel { bytes transfer_id = 1; }
message UploadCancelled { bytes transfer_id = 1; }
