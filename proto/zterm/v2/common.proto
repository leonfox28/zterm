syntax = "proto3";

package zterm.v2;

message DeviceId { bytes value = 1; }
message SessionId { bytes value = 1; }
message AttachmentId { bytes value = 1; }
message ResumeViewId { bytes value = 1; }

message SessionSelector {
  oneof selector {
    SessionId session_id = 1;
    string name = 2;
  }
}

message TerminalViewport {
  uint32 rows = 1;
  uint32 columns = 2;
}

message OperationId {
  uint64 lease_ordinal = 1;
  uint64 sequence = 2;
  bytes daemon_incarnation = 3;
}

message OperationLease {
  bytes daemon_incarnation = 1;
  uint64 ordinal = 2;
}

message TargetSelector {
  oneof target {
    bool local = 1;
    DeviceId device = 2;
  }
}

message ProtocolVersion {
  uint32 wire_major = 1;
  uint32 state_schema = 2;
  uint64 capabilities = 3;
}

message ServiceError {
  string code = 1;
  string message = 2;
}
