# Production configuration for a TLS-terminating reverse proxy on the same host.
# The container serves plain HTTP only; Docker publishes this listener on host
# loopback, so it must never be exposed directly to an untrusted network.

enable_relay = true
http_bind_addr = "0.0.0.0:38451"
enable_quic_addr_discovery = false
enable_metrics = true
metrics_bind_addr = "0.0.0.0:9090"
access = "everyone"

# Intentionally no [tls] section: the host reverse proxy owns public TLS.
# Intentionally no [limits] section: Phase Zero preserves the approved open,
# unlimited upstream policy.
