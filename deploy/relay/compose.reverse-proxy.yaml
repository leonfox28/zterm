name: zterm-relay-reverse-proxy

services:
  relay:
    image: "${RELAY_IMAGE:?Set RELAY_IMAGE to an immutable GHCR digest}"
    command:
      - --config-path
      - /etc/iroh-relay/relay.toml
    environment:
      RUST_LOG: ${RELAY_LOG_LEVEL:-info}
    configs:
      - source: relay_config
        target: /etc/iroh-relay/relay.toml
    ports:
      - "127.0.0.1:${RELAY_PROXY_PORT:-38451}:38451/tcp"
      - "127.0.0.1:${RELAY_METRICS_PORT:-9090}:9090/tcp"
    read_only: true
    tmpfs:
      - /tmp:mode=1777,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/zterm-relay-healthcheck
        - 127.0.0.1:38451
        - /healthz
        - "200"
        - '"status":"ok"'
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

configs:
  relay_config:
    file: ./relay.reverse-proxy.toml
