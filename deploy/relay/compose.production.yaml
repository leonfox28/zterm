name: zterm-relay

services:
  relay:
    image: "${RELAY_IMAGE:?Set RELAY_IMAGE to an immutable GHCR digest}"
    command:
      - --config-path
      - /etc/iroh-relay/relay.toml
    environment:
      RUST_LOG: ${RELAY_LOG_LEVEL:-info}
    configs:
      - source: relay_config
        target: /etc/iroh-relay/relay.toml
        mode: 0444
    ports:
      - "${RELAY_PUBLIC_BIND_IP:-0.0.0.0}:80:80/tcp"
      - "${RELAY_PUBLIC_BIND_IP:-0.0.0.0}:443:443/tcp"
      - "${RELAY_PUBLIC_BIND_IP:-0.0.0.0}:7842:7842/udp"
      - "127.0.0.1:${RELAY_METRICS_PORT:-9090}:9090/tcp"
    volumes:
      - relay_certs:/var/lib/iroh-relay
    read_only: true
    tmpfs:
      - /tmp:mode=1777,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/zterm-relay-healthcheck
        - 127.0.0.1:80
        - /generate_204
        - "204"
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

configs:
  relay_config:
    content: |
      enable_relay = true
      http_bind_addr = "0.0.0.0:80"
      enable_quic_addr_discovery = true
      enable_metrics = true
      metrics_bind_addr = "0.0.0.0:9090"
      access = "everyone"

      [tls]
      https_bind_addr = "0.0.0.0:443"
      quic_bind_addr = "0.0.0.0:7842"
      hostname = "${RELAY_HOSTNAME:?Set RELAY_HOSTNAME to the public relay hostname}"
      cert_mode = "LetsEncrypt"
      cert_dir = "/var/lib/iroh-relay"
      prod_tls = ${RELAY_ACME_PRODUCTION:-true}
      contact = "${RELAY_ACME_CONTACT:?Set RELAY_ACME_CONTACT to the ACME email address}"

volumes:
  relay_certs:
