[workspace]
members = [
    "crates/cli",
    "crates/core",
    "crates/daemon",
    "crates/platform",
    "crates/proto",
]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
anyhow = "1"
base64 = "=0.22.1"
clap = { version = "=4.6.6", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions", "derive"] }
futures-util = "0.3"
iroh = { version = "=1.0.3", default-features = false, features = ["portmapper", "tls-ring"] }
nix = { version = "=0.28.0", default-features = false, features = ["fs", "process", "socket", "user"] }
patchbay = { version = "=0.6.0" }
portable-pty = "=0.9.0"
prost = "=0.14.4"
prost-build = "=0.14.4"
protoc-bin-vendored = "=3.2.0"
ring = "=0.17.14"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tempfile = "=3.27.0"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
toml = "=1.1.4"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.20", default-features = false, features = ["fmt", "registry"] }
vt100 = "=0.16.2"
zeroize = "=1.9.0"
zterm-core = { path = "crates/core" }
zterm-daemon = { path = "crates/daemon" }
zterm-platform = { path = "crates/platform" }
zterm-proto = { path = "crates/proto" }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
