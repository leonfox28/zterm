[workspace]
members = [
    "crates/cli",
    "crates/core",
    "crates/daemon",
    "crates/platform",
    "crates/proto",
]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
anyhow = "1"
futures-util = "0.3"
iroh = { version = "=1.0.3", default-features = false, features = ["portmapper", "tls-ring"] }
nix = { version = "=0.28.0", default-features = false, features = ["fs", "user"] }
patchbay = { version = "=0.6.0" }
portable-pty = "=0.9.0"
prost = "=0.14.4"
prost-build = "=0.14.4"
protoc-bin-vendored = "=3.2.0"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
vt100 = "=0.16.2"
zterm-core = { path = "crates/core" }
zterm-daemon = { path = "crates/daemon" }
zterm-platform = { path = "crates/platform" }
zterm-proto = { path = "crates/proto" }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
