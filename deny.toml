[graph]
all-features = true
no-default-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "Informational unmaintained notice for transitive paste 1.0.15; no patched paste release exists, and pinned Iroh/Patchbay require it." },
]

[licenses]
version = 2
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8
# Keep non-baseline licenses scoped to the exact transitive crates introduced by
# pinned Iroh 1.0.3 instead of allowing them for future dependencies globally.
exceptions = [
    { crate = "async_io_stream@0.3.3", allow = ["Unlicense"] },
    { crate = "attohttpc@0.30.1", allow = ["MPL-2.0"] },
    { crate = "pharos@0.5.3", allow = ["Unlicense"] },
    { crate = "webpki-root-certs@1.0.9", allow = ["CDLA-Permissive-2.0"] },
    { crate = "webpki-roots@1.0.9", allow = ["CDLA-Permissive-2.0"] },
    { crate = "ws_stream_wasm@0.7.5", allow = ["Unlicense"] },
]

[licenses.private]
# The project license is intentionally not selected during requirements work.
# Workspace crates are unpublished; dependency licenses remain fully checked.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
