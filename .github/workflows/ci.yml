name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  policy:
    name: Policy and portable checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install exact Rust toolchain
        run: >-
          rustup toolchain install 1.98.0 --profile minimal
          --component rustfmt
      - name: Restore dependency downloads
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-downloads-v2-rust-1.98.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-downloads-v2-rust-1.98.0-${{ runner.os }}-${{ runner.arch }}-
      - uses: ./.github/actions/setup-ci-tools
        with:
          profile: policy
      - name: Run the canonical portable policy profile
        run: just ci-policy
      - name: Explain reproduction on failure
        if: failure()
        run: echo "Reproduce with just ci-policy after just doctor." >> "$GITHUB_STEP_SUMMARY"

  rust:
    name: Rust / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            os: macos-latest
            docs: false
            smoke: true
          - label: Linux x64
            os: ubuntu-24.04
            docs: true
            smoke: true
          - label: Linux arm64
            os: ubuntu-24.04-arm
            docs: false
            smoke: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check source checkout policy
        shell: bash
        run: sh tests/source-policy.sh
      - name: Install exact Rust toolchain
        run: >-
          rustup toolchain install 1.98.0 --profile minimal
          --component clippy --component rust-src
      - name: Restore dependency downloads
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-downloads-v2-rust-1.98.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-downloads-v2-rust-1.98.0-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore compiled dependencies
        id: compiled
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            target/debug/deps
            target/debug/build
            target/debug/.fingerprint
          key: ci-compiled-v2-rust-1.98.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ci-compiled-v2-rust-1.98.0-${{ runner.os }}-${{ runner.arch }}-
      - uses: ./.github/actions/setup-ci-tools
        with:
          profile: rust
      - name: Run full Unix platform evidence
        shell: bash
        run: just ci-unix "${{ matrix.docs }}" "${{ matrix.smoke }}"
      - name: Bound the main compiled dependency cache
        id: trim
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.compiled.outputs.cache-hit != 'true'
        run: sh tools/ci/trim-rust-cache.sh
      - name: Save main compiled dependencies
        if: steps.trim.outputs.cacheable == 'true'
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            target/debug/deps
            target/debug/build
            target/debug/.fingerprint
          key: ${{ steps.compiled.outputs.cache-primary-key }}
      - name: Explain reproduction on failure
        if: failure()
        run: echo 'Reproduce on the matching Unix host with just ci-unix ${{ matrix.docs }} ${{ matrix.smoke }}.' >> "$GITHUB_STEP_SUMMARY"

  candidates-macos:
    name: Release candidate / ${{ matrix.target }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check source checkout policy
        run: sh tests/source-policy.sh
      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Restore dependency downloads
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-downloads-v2-rust-1.98.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-downloads-v2-rust-1.98.0-${{ runner.os }}-${{ runner.arch }}-
      - name: Build and inspect the shipped binary boundary
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          export ZTERM_SOURCE_COMMIT="$GITHUB_SHA"
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          export SOURCE_DATE_EPOCH
          sh tools/release/build-native.sh release-input
      - name: Upload the native candidate and identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.target }}
          path: release-input/
          overwrite: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Explain reproduction on failure
        if: failure()
        run: echo "Reproduce on the exact native host with RELEASE_TARGET=${{ matrix.target }} sh tools/release/build-native.sh release-input with explicit ZTERM_SOURCE_COMMIT and SOURCE_DATE_EPOCH." >> "$GITHUB_STEP_SUMMARY"

  candidates-linux:
    name: Release candidate / ${{ matrix.target }} / glibc 2.28
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    container:
      image: debian:10-slim@sha256:bb3dc79fddbca7e8903248ab916bb775c96ec61014b3d02b4f06043b604726dc
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - name: Bootstrap Git for the pinned container checkout
        shell: bash
        run: |
          set -euo pipefail
          sed -i \
            -e 's|^# deb http://snapshot|deb [check-valid-until=no] http://snapshot|' \
            -e 's|^deb http://deb|# deb http://deb|' \
            /etc/apt/sources.list
          apt-get -o Acquire::Check-Valid-Until=false update
          DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
            ca-certificates git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check source checkout policy
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sh tests/source-policy.sh
      - name: Prepare the pinned glibc builder
        run: sh tools/release/setup-glibc-builder.sh
      - name: Restore dependency downloads
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-downloads-v2-rust-1.98.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-downloads-v2-rust-1.98.0-${{ runner.os }}-${{ runner.arch }}-
      - name: Build and inspect the shipped binary boundary
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          export ZTERM_SOURCE_COMMIT="$GITHUB_SHA"
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          export SOURCE_DATE_EPOCH
          sh tools/release/build-native.sh release-input
      - name: Upload the native candidate and identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.target }}
          path: release-input/
          overwrite: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Explain reproduction on failure
        if: failure()
        run: echo "Reproduce in the pinned Debian container with RELEASE_TARGET=${{ matrix.target }} sh tools/release/build-native.sh release-input with explicit ZTERM_SOURCE_COMMIT and SOURCE_DATE_EPOCH." >> "$GITHUB_STEP_SUMMARY"

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Restore dependency downloads
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-downloads-v2-rust-1.98.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-downloads-v2-rust-1.98.0-${{ runner.os }}-${{ runner.arch }}-
      - uses: ./.github/actions/setup-ci-tools
        with:
          profile: dependencies
      - name: Run both dependency-policy owners
        run: just ci-dependencies
      - name: Explain reproduction on failure
        if: failure()
        run: echo "Reproduce with just ci-dependencies." >> "$GITHUB_STEP_SUMMARY"

  relay:
    name: Official relay bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install exact Rust toolchain
        run: >-
          rustup toolchain install 1.98.0 --profile minimal
          --component clippy --component rustfmt
      - name: Restore dependency downloads
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-downloads-v2-rust-1.98.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-downloads-v2-rust-1.98.0-${{ runner.os }}-${{ runner.arch }}-
      - uses: ./.github/actions/setup-ci-tools
        with:
          profile: rust
      - name: Register cross-architecture emulation
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Create a BuildKit builder
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Run the complete relay evidence profile
        run: just ci-relay
      - name: Explain reproduction on failure
        if: failure()
        run: echo "Reproduce on Docker-capable Linux with just ci-relay." >> "$GITHUB_STEP_SUMMARY"

  candidate:
    name: Assemble the exact release candidate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - candidates-macos
      - candidates-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal

      - name: Restore dependency downloads
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-downloads-v2-rust-1.98.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-downloads-v2-rust-1.98.0-${{ runner.os }}-${{ runner.arch }}-

      - name: Download the three native candidates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-*
          path: release-input
          merge-multiple: true

      - name: Build the single archive and manifest owner
        run: cargo +1.98.0 build --locked --release --package zterm-release-tool

      - name: Archive the three raw native candidates once
        run: |
          set -eu
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          export SOURCE_DATE_EPOCH
          for target in \
            aarch64-apple-darwin \
            aarch64-unknown-linux-gnu \
            x86_64-unknown-linux-gnu; do
            chmod 700 "release-input/zterm-$target"
            target/release/zterm-release-tool archive \
              "release-input/zterm-$target" \
              "release-input/zterm-$target.tar.gz"
          done

      - name: Assemble and verify the exact unsigned inventory
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -eu
          version=$(cargo +1.98.0 metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "zterm-cli") | .version')
          released_at=$(date -u -d "@$(git show -s --format=%ct HEAD)" '+%Y-%m-%dT%H:%M:%SZ')
          target/release/zterm-release-tool \
            prepare release-input release-output "v$version" "$SOURCE_COMMIT" "$released_at"
          target/release/zterm-release-tool verify-unsigned release-output

      - name: Check the generated installer with ShellCheck
        run: |
          command -v shellcheck
          shellcheck -s sh release-output/zterm-install.sh

      - name: Upload the unsigned exact inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: release-output/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  gate:
    name: CI gate
    if: always()
    needs:
      - policy
      - rust
      - candidate
      - dependencies
      - relay
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every event-owned evidence result
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          POLICY_RESULT: ${{ needs.policy.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          CANDIDATE_RESULT: ${{ needs.candidate.result }}
          DEPENDENCY_RESULT: ${{ needs.dependencies.result }}
          RELAY_RESULT: ${{ needs.relay.result }}
        run: |
          set -euo pipefail
          failed=false
          for result in "$POLICY_RESULT" "$RUST_RESULT" "$DEPENDENCY_RESULT" "$RELAY_RESULT"; do
            if [ "$result" != success ]; then failed=true; fi
          done
          if [ "$EVENT_NAME" = push ] && [ "$REF_NAME" = refs/heads/main ]; then
            if [ "$CANDIDATE_RESULT" != success ]; then failed=true; fi
          else
            if [ "$CANDIDATE_RESULT" != skipped ]; then failed=true; fi
          fi
          {
            echo '## CI ownership summary'
            echo "- policy: $POLICY_RESULT (just ci-policy)"
            echo "- Rust matrix: $RUST_RESULT (just ci-unix)"
            echo "- dependencies: $DEPENDENCY_RESULT (just ci-dependencies)"
            echo "- relay: $RELAY_RESULT (just ci-relay)"
            echo "- three-platform release candidate: $CANDIDATE_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$failed" = false ] || exit 1
