name: signed native release

on:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: read

concurrency:
  group: signed-native-release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  validate:
    name: Validate exact immutable release source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      ci_run_id: ${{ steps.source.outputs.ci_run_id }}
      ci_run_url: ${{ steps.source.outputs.ci_run_url }}
      candidate_id: ${{ steps.source.outputs.candidate_id }}
      prerelease: ${{ steps.source.outputs.prerelease }}
    steps:
      - name: Check out the exact existing tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal

      - name: Validate tag, version, green main CI, and release vacancy
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          version=$(cargo +1.98.0 metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "zterm-cli") | .version')
          case "$version" in
            *+*) echo "formal release versions must not contain SemVer build metadata" >&2; exit 1 ;;
          esac
          test "$RELEASE_TAG" = "v$version"
          test "$(git tag --points-at HEAD --list "$RELEASE_TAG")" = "$RELEASE_TAG"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          set +e
          release_lookup=$(gh api --include \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" 2>&1)
          release_status=$?
          set -e
          case "$release_status" in
            0)
              echo "the tag already has a Release; assets are never replaced" >&2
              exit 1
              ;;
            *)
              printf '%s\n' "$release_lookup" | grep -Eq 'HTTP[/][^ ]+ 404|HTTP 404' \
                || { echo "could not prove Release vacancy" >&2; exit 1; }
              ;;
          esac
          commit=$(git rev-parse HEAD)
          green_ci=$(sh tools/release/find-green-main-ci.sh "$commit")
          ci_run_id=${green_ci%% *}
          ci_run_url=${green_ci#* }
          test "$ci_run_id" != "$green_ci"
          test -n "$ci_run_id" && test -n "$ci_run_url"
          case "$ci_run_url" in *' '*) exit 1 ;; esac
          candidate_id=$(sh tools/release/find-candidate.sh "$ci_run_id" "$commit")
          case "$version" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          {
            echo "commit=$commit"
            echo "ci_run_id=$ci_run_id"
            echo "ci_run_url=$ci_run_url"
            echo "candidate_id=$candidate_id"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  sign:
    name: Approve and sign exact manifest bytes
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    outputs:
      signed_artifact_id: ${{ steps.signed.outputs.artifact-id }}
      fixture_artifact_id: ${{ steps.fixture.outputs.artifact-id }}
    steps:
      - name: Check out the exact existing tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false

      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal

      - name: Download the unsigned inventory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.validate.outputs.candidate_id }}
          run-id: ${{ needs.validate.outputs.ci_run_id }}
          github-token: ${{ github.token }}
          digest-mismatch: error
          path: release-output

      - name: Build the reviewed signing tool without the signing secret
        run: >-
          cargo +1.98.0 build --locked --release --package zterm-release-tool

      - name: Verify the exact main candidate before secret exposure
        env:
          SOURCE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          target/release/zterm-release-tool verify-unsigned release-output
          jq -e --arg commit "$SOURCE_COMMIT" '.source_commit == $commit' \
            release-output/zterm-release.json >/dev/null

      - name: Sign and self-verify with the protected release key
        env:
          ZTERM_RELEASE_SIGNING_KEY: ${{ secrets.ZTERM_RELEASE_SIGNING_KEY }}
        run: target/release/zterm-release-tool sign release-output

      - name: Render the authenticated fixture-only installer
        run: |
          mkdir fixture
          target/release/zterm-release-tool \
            render-test-installer release-output fixture/zterm-install-test.sh

      - name: Upload the signed exact inventory
        id: signed
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-release-${{ github.ref_name }}-${{ github.run_attempt }}
          path: release-output/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

      - name: Upload the fixture-only installer separately
        id: fixture
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-fixture-${{ github.ref_name }}-${{ github.run_attempt }}
          path: fixture/zterm-install-test.sh
          if-no-files-found: error
          retention-days: 7

  installer:
    name: Install ${{ matrix.target }} from local HTTPS
    needs:
      - validate
      - sign
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    steps:
      - name: Check out the exact existing tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false

      - name: Download the signed inventory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.sign.outputs.signed_artifact_id }}
          path: release-output

      - name: Download the fixture-only installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.sign.outputs.fixture_artifact_id }}
          path: fixture

      - name: Check installer POSIX syntax
        run: |
          sh -n install/install.sh tests/release/installer-fixture.sh \
            fixture/zterm-install-test.sh

      - name: Exercise authenticated install and smallest preflight negatives
        run: >-
          sh tests/release/installer-fixture.sh
          "$PWD/release-output" "$PWD/fixture/zterm-install-test.sh"

  publish:
    name: Create, verify, attest, and publish the immutable Release
    needs:
      - validate
      - sign
      - installer
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      release_url: ${{ steps.publication.outputs.release_url }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out the exact existing tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false

      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal

      - name: Restore dependency downloads
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-downloads-v2-rust-1.98.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-downloads-v2-rust-1.98.0-${{ runner.os }}-${{ runner.arch }}-

      - name: Download and verify the signed inventory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.sign.outputs.signed_artifact_id }}
          path: release-output

      - name: Re-verify before creating external state
        run: >-
          cargo +1.98.0 run --locked --release --package zterm-release-tool --
          verify release-output

      - name: Create one draft from the frozen tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ needs.validate.outputs.commit }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$SOURCE_COMMIT"
          set +e
          release_lookup=$(gh api --include \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" 2>&1)
          release_status=$?
          set -e
          case "$release_status" in
            0)
              echo "the tag already has a Release; assets are never replaced" >&2
              exit 1
              ;;
            *)
              printf '%s\n' "$release_lookup" | grep -Eq 'HTTP[/][^ ]+ 404|HTTP 404' \
                || { echo "could not prove Release vacancy" >&2; exit 1; }
              ;;
          esac
          flags=(--draft --verify-tag --target "$SOURCE_COMMIT" \
            --title "zterm $RELEASE_TAG" --generate-notes)
          if [ "$PRERELEASE" = true ]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${flags[@]}"
          gh release upload "$RELEASE_TAG" \
            release-output/SHA256SUMS \
            release-output/zterm-release.json \
            release-output/zterm-release.json.sig \
            release-output/zterm-install.sh \
            release-output/zterm-sbom.spdx.json \
            release-output/zterm-aarch64-apple-darwin.tar.gz \
            release-output/zterm-aarch64-unknown-linux-gnu.tar.gz \
            release-output/zterm-x86_64-unknown-linux-gnu.tar.gz

      - name: Download and verify the draft asset round-trip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir roundtrip
          gh release download "$RELEASE_TAG" --dir roundtrip --pattern '*'
          cargo +1.98.0 run --locked --release --package zterm-release-tool -- \
            verify roundtrip
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true

      - name: Attest the exact verified draft inventory
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: roundtrip/*

      - name: Publish and verify the immutable formal Release
        id: publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" --draft=false
          release_json=$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
          printf '%s\n' "$release_json" \
            | jq -e --arg tag "$RELEASE_TAG" \
              '.tag_name == $tag and .draft == false and .immutable == true' \
              >/dev/null
          release_url=$(printf '%s\n' "$release_json" | jq -r .html_url)
          test -n "$release_url"
          echo "release_url=$release_url" >> "$GITHUB_OUTPUT"

  complete:
    name: Release completion summary
    if: always()
    needs:
      - validate
      - publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report native publication
        env:
          CI_RUN_URL: ${{ needs.validate.outputs.ci_run_url }}
          NATIVE_RESULT: ${{ needs.publish.result }}
          NATIVE_URL: ${{ needs.publish.outputs.release_url }}
        run: |
          {
            echo '## Formal release summary'
            echo "- exact green main CI and candidate: $CI_RUN_URL"
            echo "- immutable three-platform Release: $NATIVE_RESULT $NATIVE_URL"
          } >> "$GITHUB_STEP_SUMMARY"
