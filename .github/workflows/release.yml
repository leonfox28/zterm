name: signed native release

on:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: read

concurrency:
  group: signed-native-release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  validate:
    name: Validate exact immutable release source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      ci_run_id: ${{ steps.source.outputs.ci_run_id }}
      ci_run_url: ${{ steps.source.outputs.ci_run_url }}
      source_epoch: ${{ steps.source.outputs.source_epoch }}
      released_at: ${{ steps.source.outputs.released_at }}
      prerelease: ${{ steps.source.outputs.prerelease }}
    steps:
      - name: Check out the exact existing tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal

      - name: Validate tag, version, green main CI, and release vacancy
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          version=$(cargo +1.98.0 metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "zterm-cli") | .version')
          case "$version" in
            *+*) echo "formal release versions must not contain SemVer build metadata" >&2; exit 1 ;;
          esac
          test "$RELEASE_TAG" = "v$version"
          test "$(git tag --points-at HEAD --list "$RELEASE_TAG")" = "$RELEASE_TAG"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          set +e
          release_lookup=$(gh api --include \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" 2>&1)
          release_status=$?
          set -e
          case "$release_status" in
            0)
              echo "the tag already has a Release; assets are never replaced" >&2
              exit 1
              ;;
            *)
              printf '%s\n' "$release_lookup" | grep -Eq 'HTTP[/][^ ]+ 404|HTTP 404' \
                || { echo "could not prove Release vacancy" >&2; exit 1; }
              ;;
          esac
          commit=$(git rev-parse HEAD)
          green_ci=$(sh tools/release/find-green-main-ci.sh "$commit")
          ci_run_id=${green_ci%% *}
          ci_run_url=${green_ci#* }
          test "$ci_run_id" != "$green_ci"
          test -n "$ci_run_id" && test -n "$ci_run_url"
          case "$ci_run_url" in *' '*) exit 1 ;; esac
          source_epoch=$(git show -s --format=%ct HEAD)
          released_at=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          case "$version" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          {
            echo "commit=$commit"
            echo "ci_run_id=$ci_run_id"
            echo "ci_run_url=$ci_run_url"
            echo "source_epoch=$source_epoch"
            echo "released_at=$released_at"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  macos-artifacts:
    name: Build ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    env:
      SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.source_epoch }}
      ZTERM_SOURCE_COMMIT: ${{ needs.validate.outputs.commit }}
    steps:
      - name: Check out the exact existing tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false

      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal

      - name: Restore dependency downloads only
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: release-downloads-rust-1.98.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}

      - name: Build and inspect the native candidate
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: sh tools/release/build-native.sh formal release-input

      - name: Upload the native candidate and identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.target }}
          path: release-input/
          if-no-files-found: error
          retention-days: 7

  linux-artifacts:
    name: Build ${{ matrix.target }} at glibc 2.28
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    container:
      image: debian:10-slim@sha256:bb3dc79fddbca7e8903248ab916bb775c96ec61014b3d02b4f06043b604726dc
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    env:
      SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.source_epoch }}
      ZTERM_SOURCE_COMMIT: ${{ needs.validate.outputs.commit }}
    steps:
      - name: Bootstrap Git for the pinned container checkout
        shell: bash
        run: |
          set -euo pipefail
          sed -i \
            -e 's|^# deb http://snapshot|deb [check-valid-until=no] http://snapshot|' \
            -e 's|^deb http://deb|# deb http://deb|' \
            /etc/apt/sources.list
          apt-get -o Acquire::Check-Valid-Until=false update
          DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
            ca-certificates git

      - name: Check out the exact existing tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false

      - name: Check source checkout policy
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sh tests/source-policy.sh

      - name: Prepare the pinned glibc builder
        run: sh tools/release/setup-glibc-builder.sh

      - name: Restore dependency downloads only
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: release-downloads-rust-1.98.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}

      - name: Build and inspect the native candidate
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: sh tools/release/build-native.sh formal release-input

      - name: Upload the native candidate and identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.target }}
          path: release-input/
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: Assemble and verify unsigned assets
    needs:
      - validate
      - macos-artifacts
      - linux-artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the exact existing tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false

      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal

      - name: Restore dependency downloads only
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: release-assembly-downloads-rust-1.98.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}

      - name: Download all four native candidates
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: native-*
          path: release-input
          merge-multiple: true

      - name: Build the single archive and manifest owner
        run: cargo +1.98.0 build --locked --release --package zterm-release-tool

      - name: Archive the four raw native candidates once
        env:
          SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.source_epoch }}
        run: |
          set -eu
          for target in \
            aarch64-apple-darwin \
            x86_64-apple-darwin \
            aarch64-unknown-linux-gnu \
            x86_64-unknown-linux-gnu; do
            chmod 700 "release-input/zterm-$target"
            target/release/zterm-release-tool archive \
              "release-input/zterm-$target" \
              "release-input/zterm-$target.tar.gz"
          done

      - name: Assemble and verify the exact unsigned inventory
        env:
          SOURCE_COMMIT: ${{ needs.validate.outputs.commit }}
          RELEASED_AT: ${{ needs.validate.outputs.released_at }}
        run: |
          target/release/zterm-release-tool \
            prepare release-input release-output "$RELEASE_TAG" "$SOURCE_COMMIT" "$RELEASED_AT"
          target/release/zterm-release-tool verify-unsigned release-output

      - name: Check the generated installer with ShellCheck
        run: |
          command -v shellcheck
          shellcheck -s sh release-output/zterm-install.sh

      - name: Upload the unsigned exact inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-release-${{ github.ref_name }}
          path: release-output/
          if-no-files-found: error
          retention-days: 7

  sign:
    name: Approve and sign exact manifest bytes
    needs:
      - validate
      - assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    steps:
      - name: Check out the exact existing tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false

      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal

      - name: Download the unsigned inventory
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-release-${{ github.ref_name }}
          path: release-output

      - name: Build the reviewed signing tool without the signing secret
        run: >-
          cargo +1.98.0 build --locked --release --package zterm-release-tool

      - name: Sign and self-verify with the protected release key
        env:
          ZTERM_RELEASE_SIGNING_KEY: ${{ secrets.ZTERM_RELEASE_SIGNING_KEY }}
        run: target/release/zterm-release-tool sign release-output

      - name: Render the authenticated fixture-only installer
        run: |
          mkdir fixture
          target/release/zterm-release-tool \
            render-test-installer release-output fixture/zterm-install-test.sh

      - name: Upload the signed exact inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-release-${{ github.ref_name }}
          path: release-output/
          if-no-files-found: error
          retention-days: 7

      - name: Upload the fixture-only installer separately
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-fixture-${{ github.ref_name }}
          path: fixture/zterm-install-test.sh
          if-no-files-found: error
          retention-days: 7

  installer:
    name: Install ${{ matrix.target }} from local HTTPS
    needs:
      - validate
      - sign
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    steps:
      - name: Check out the exact existing tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false

      - name: Download the signed inventory
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-release-${{ github.ref_name }}
          path: release-output

      - name: Download the fixture-only installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: installer-fixture-${{ github.ref_name }}
          path: fixture

      - name: Check installer POSIX syntax
        run: |
          sh -n install/install.sh tests/release/installer-fixture.sh \
            fixture/zterm-install-test.sh

      - name: Exercise authenticated install and smallest preflight negatives
        run: >-
          sh tests/release/installer-fixture.sh
          "$PWD/release-output" "$PWD/fixture/zterm-install-test.sh"

  publish:
    name: Create, verify, attest, and publish the immutable Release
    needs:
      - validate
      - installer
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      release_url: ${{ steps.publication.outputs.release_url }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out the exact existing tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false

      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal

      - name: Restore dependency downloads only
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: release-publish-downloads-rust-1.98.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}

      - name: Download and verify the signed inventory
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-release-${{ github.ref_name }}
          path: release-output

      - name: Re-verify before creating external state
        run: >-
          cargo +1.98.0 run --locked --release --package zterm-release-tool --
          verify release-output

      - name: Create one draft from the frozen tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ needs.validate.outputs.commit }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$SOURCE_COMMIT"
          set +e
          release_lookup=$(gh api --include \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" 2>&1)
          release_status=$?
          set -e
          case "$release_status" in
            0)
              echo "the tag already has a Release; assets are never replaced" >&2
              exit 1
              ;;
            *)
              printf '%s\n' "$release_lookup" | grep -Eq 'HTTP[/][^ ]+ 404|HTTP 404' \
                || { echo "could not prove Release vacancy" >&2; exit 1; }
              ;;
          esac
          flags=(--draft --verify-tag --target "$SOURCE_COMMIT" \
            --title "zterm $RELEASE_TAG" --generate-notes)
          if [ "$PRERELEASE" = true ]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${flags[@]}"
          gh release upload "$RELEASE_TAG" \
            release-output/SHA256SUMS \
            release-output/zterm-release.json \
            release-output/zterm-release.json.sig \
            release-output/zterm-install.sh \
            release-output/zterm-sbom.spdx.json \
            release-output/zterm-aarch64-apple-darwin.tar.gz \
            release-output/zterm-x86_64-apple-darwin.tar.gz \
            release-output/zterm-aarch64-unknown-linux-gnu.tar.gz \
            release-output/zterm-x86_64-unknown-linux-gnu.tar.gz

      - name: Download and verify the draft asset round-trip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir roundtrip
          gh release download "$RELEASE_TAG" --dir roundtrip --pattern '*'
          cargo +1.98.0 run --locked --release --package zterm-release-tool -- \
            verify roundtrip
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true

      - name: Attest the exact verified draft inventory
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: roundtrip/*

      - name: Publish and verify the immutable formal Release
        id: publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" --draft=false
          release_json=$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
          printf '%s\n' "$release_json" \
            | jq -e --arg tag "$RELEASE_TAG" \
              '.tag_name == $tag and .draft == false and .immutable == true' \
              >/dev/null
          release_url=$(printf '%s\n' "$release_json" | jq -r .html_url)
          test -n "$release_url"
          echo "release_url=$release_url" >> "$GITHUB_OUTPUT"

  relay:
    name: Publish companion relay image
    needs:
      - validate
      - publish
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/relay-image.yml
    with:
      commit: ${{ needs.validate.outputs.commit }}
      tag: ${{ github.ref_name }}
      prerelease: ${{ needs.validate.outputs.prerelease == 'true' }}

  complete:
    name: Release completion summary
    if: always()
    needs:
      - validate
      - publish
      - relay
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report native and relay outcomes
        env:
          CI_RUN_URL: ${{ needs.validate.outputs.ci_run_url }}
          NATIVE_RESULT: ${{ needs.publish.result }}
          NATIVE_URL: ${{ needs.publish.outputs.release_url }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          RELAY_RESULT: ${{ needs.relay.result }}
        run: |
          relay_owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          {
            echo '## Formal release summary'
            echo "- exact green main CI: $CI_RUN_URL"
            echo "- immutable native Release: $NATIVE_RESULT $NATIVE_URL"
            echo "- explicit relay image publication: $RELAY_RESULT"
            if [ "$PRERELEASE" = true ]; then
              echo "- relay target: ghcr.io/$relay_owner/zterm-relay-dev:$RELEASE_TAG"
            elif [ "$PRERELEASE" = false ]; then
              echo "- relay targets: ghcr.io/$relay_owner/zterm-relay:$RELEASE_TAG and :latest"
            fi
            if [ "$NATIVE_RESULT" = success ] && [ "$RELAY_RESULT" != success ]; then
              echo '- recovery: keep the immutable native Release and rerun only the failed relay job for this frozen tag; never replace native assets.'
              echo "- recovery command: gh run rerun $GITHUB_RUN_ID --failed --repo $GITHUB_REPOSITORY"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
